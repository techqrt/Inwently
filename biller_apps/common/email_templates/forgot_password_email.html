<html>
    <body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
        <table width="100%" height="100%" style="border-spacing: 0; border-collapse: collapse; background-color: #f4f4f4; padding: 20px 0;">
            <tr>
                <td align="center" valign="top">
                    <!-- Outer container -->
                    <table width="600px" style="background-color: #ffffff; border: 2px solid #e0e0e0; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                        <!-- Header -->
                        <tr>
                            <td style="text-align: center; padding: 20px 0;">
                                <h1 style="font-size: 24px; color: #333333; margin: 0;">Password Reset</h1>
                                <p style="font-size: 14px; color: #888888; margin: 5px 0 0;">We received a request to reset your password</p>
                            </td>
                        </tr>
                        <!-- Body -->
                        <tr>
                            <td style="font-size: 16px; line-height: 1.6; color: #555555; padding: 20px 30px;">
                                <p>Hi {{name}},</p>
                                <p>It seems like you have requested to reset your password</p>
                                <h4>Your Password is Successfully Changed</h4>
                                <h6>If This is not done by you, Please inform the administrator Immediately</h6>

                            </td>
                        </tr>
                        <!-- Footer -->
                        <tr>
                            <td style="font-size: 12px; line-height: 1.4; color: #aaaaaa; text-align: center; padding: 10px 30px;">

                                <p style="margin: 0;">&copy; 2024 Caddayn. All rights reserved.</p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
